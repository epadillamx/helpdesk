# =========================================================================
# Frappe Helpdesk - Nginx reverse proxy
# =========================================================================
upstream frappe_backend {
    server backend:8000;
}

upstream frappe_socketio {
    server socketio:9000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Static assets generados por bench build
    location /assets/ {
        alias /var/www/assets/;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Archivos públicos del sitio (logos, imágenes públicas)
    # Los attachments suben a S3, pero algunos archivos viven en el FS
    location /files/ {
        root /var/www/sites/$host;
        try_files $uri =404;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://frappe_socketio;
    }

    # Aplicación Frappe (incluye /helpdesk SPA)
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $host;
        proxy_pass http://frappe_backend;
    }
}
