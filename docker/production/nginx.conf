# =========================================================================
# Frappe Helpdesk - Nginx reverse proxy
#
# IMPORTANTE: usamos el DNS embebido de Docker (127.0.0.11) y `proxy_pass`
# con variables. Sin esto, nginx resuelve `backend`/`socketio` UNA SOLA VEZ
# al levantarse y cachea el IP. Cuando recreás esos contenedores cambian
# de IP y nginx queda apuntando a un IP fantasma → 502 hasta que reinicies
# nginx. Con resolver + variable, nginx re-resuelve cada cierto tiempo.
# =========================================================================
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Static assets generados por bench build
    location /assets/ {
        alias /var/www/assets/;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Archivos públicos del sitio (logos, imágenes públicas)
    # Los attachments suben a S3, pero algunos archivos viven en el FS
    location /files/ {
        root /var/www/sites/$host;
        try_files $uri =404;
    }

    # Socket.IO
    location /socket.io/ {
        set $upstream_socketio http://socketio:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $upstream_socketio;
    }

    # Aplicación Frappe (incluye /helpdesk SPA)
    location / {
        set $upstream_backend http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $host;
        proxy_pass $upstream_backend;
    }
}
